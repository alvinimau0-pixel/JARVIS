[package]
name = "jarvis-desktop"
version = "0.1.0"
description = "JARVIS OS desktop shell"
edition = "2021"
rust-version = "1.80"

[lib]
name = "jarvis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
getrandom = "0.3"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
strip = true
